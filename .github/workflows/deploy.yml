name: Build images and deploy Dahum

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "ai/**"
      - "datas/data/malware_db.csv"
      - "datas/data/malware_embedding_data.csv"
      - "db/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
      - ".dockerignore"
      - ".gitattributes"
  workflow_dispatch:

concurrency:
  group: dahum-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  statuses: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Publish deployment pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='pending' \
            -f context='deploy/yellow.it.kr' \
            -f description='Build and deployment are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Hydrate original frontend image assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="frontend/src/imports/**"
          python3 - <<'PY'
          from pathlib import Path
          pointer = b"version https://git-lfs.github.com/spec/v1"
          root = Path("frontend/src/imports")
          unresolved = [
              path.as_posix()
              for path in root.rglob("*.png")
              if path.read_bytes().startswith(pointer)
          ]
          if unresolved:
              raise SystemExit(
                  "Original frontend image assets were not hydrated from Git LFS: "
                  + ", ".join(unresolved)
              )
          print("Original frontend image assets hydrated without replacement or generated fallback.")
          PY

      - name: Set up Node for frontend preflight
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend preflight build
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Backend preflight build
        shell: bash
        run: gradle -p backend clean bootJar --no-daemon

      - name: Python syntax preflight
        shell: bash
        run: python3 -m compileall -q ai/app

      - name: Resolve GHCR image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${repo_lower}-backend" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/${repo_lower}-ai" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            VITE_KAKAO_CLIENT_ID=${{ secrets.VITE_KAKAO_CLIENT_ID }}
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest
          cache-from: type=gha,scope=dahum-backend
          cache-to: type=gha,mode=max,scope=dahum-backend

      - name: Build and push Python AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.ai }}:${{ github.sha }}
            ${{ steps.images.outputs.ai }}:latest
          cache-from: type=gha,scope=dahum-ai
          cache-to: type=gha,mode=max,scope=dahum-ai

      - name: Build runtime configuration
        id: runtime_config
        shell: bash
        env:
          MARIADB_IMAGE: ${{ vars.MARIADB_IMAGE || 'mariadb:11.4' }}
          MARIADB_DATABASE: ${{ vars.MARIADB_DATABASE || 'dahum' }}
          MARIADB_USER: ${{ vars.MARIADB_USER || 'dahum_app' }}
          MARIADB_PASSWORD: ${{ secrets.SPRINGDATASOURCEPASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADBROOTPASSWORD }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE || 'prod' }}
          SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL || 'jdbc:mariadb://mariadb:3306/dahum' }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME || 'dahum_app' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRINGDATASOURCEPASSWORD }}
          SERVER_FORWARD_HEADERS_STRATEGY: ${{ vars.SERVER_FORWARD_HEADERS_STRATEGY || 'framework' }}
          SESSION_COOKIE_SECURE: ${{ vars.SESSION_COOKIE_SECURE || 'true' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'http://ai:8000' }}
          DAHUM_RUNTIME: ${{ vars.DAHUM_RUNTIME || 'C:/home/dahum/runtime' }}
          DAHUM_HOST_PORT: ${{ vars.DAHUM_HOST_PORT || '9000' }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || 'yellow.it.kr' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://yellow.it.kr' }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAOCLIENTID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAOCLIENTSECRET }}
          CLOVA_OCR_URL: ${{ vars.CLOVAOCRURL || vars.CLOVA_OCR_URL || '' }}
          CLOVA_OCR_SECRET: ${{ secrets.CLOVA_OCR_SECRET || secrets.CLOVAOCRSECRET || '' }}
          CLOVA_SPEECH_INVOKE_URL: ${{ vars.CLOVA_SPEECH_INVOKE_URL || vars.CLOVASPEECHINVOKEURL || '' }}
          CLOVA_SPEECH_SECRET: ${{ secrets.CLOVA_SPEECH_SECRET || secrets.CLOVASPEECHSECRET || '' }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY || secrets.GOOGLESAFEBROWSINGAPIKEY || '' }}
          SAFE_BROWSING_URL: ${{ vars.SAFE_BROWSING_URL || 'https://safebrowsing.googleapis.com/v4/threatMatches:find' }}
          FRAUD_HIGH_THRESHOLD: ${{ vars.FRAUD_HIGH_THRESHOLD || '0.65' }}
          FRAUD_MEDIUM_THRESHOLD: ${{ vars.FRAUD_MEDIUM_THRESHOLD || '0.30' }}
          FRAUD_MAX_AUDIO_MB: ${{ vars.FRAUD_MAX_AUDIO_MB || '25' }}
          VECTOR_PROVIDER: ${{ vars.VECTORPROVIDER || vars.VECTOR_PROVIDER || 'local' }}
          RAG_SIMILARITY_THRESHOLD: ${{ vars.RAGSIMILARITYTHRESHOLD || vars.RAG_SIMILARITY_THRESHOLD || '0.80' }}
          RAG_TOP_K: ${{ vars.RAGTOPK || vars.RAG_TOP_K || '5' }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY || secrets.PINECONEAPIKEY || '' }}
          PINECONE_INDEX: ${{ vars.PINECONEINDEX || vars.PINECONE_INDEX || 'dahum-malware' }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY || secrets.UPSTAGEAPIKEY || '' }}
          LLM_API_KEY: ${{ secrets.LLMAPIKEY }}
          LLM_API_BASE_URL: ${{ vars.LLMAPIBASEURL || vars.LLM_API_BASE_URL || '' }}
          ALAN_CLIENT_ID: ${{ secrets.ALAN_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          keys = [
              "MARIADB_IMAGE","MARIADB_DATABASE","MARIADB_USER","MARIADB_PASSWORD","MARIADB_ROOT_PASSWORD",
              "SPRING_PROFILES_ACTIVE","SPRING_DATASOURCE_URL","SPRING_DATASOURCE_USERNAME","SPRING_DATASOURCE_PASSWORD",
              "SERVER_FORWARD_HEADERS_STRATEGY","SESSION_COOKIE_SECURE","AI_BASE_URL","DAHUM_RUNTIME","DAHUM_HOST_PORT",
              "PUBLIC_DOMAIN","PUBLIC_BASE_URL","KAKAO_CLIENT_ID","KAKAO_CLIENT_SECRET","CLOVA_OCR_URL","CLOVA_OCR_SECRET",
              "CLOVA_SPEECH_INVOKE_URL","CLOVA_SPEECH_SECRET","GOOGLE_SAFE_BROWSING_API_KEY","SAFE_BROWSING_URL",
              "FRAUD_HIGH_THRESHOLD","FRAUD_MEDIUM_THRESHOLD","FRAUD_MAX_AUDIO_MB","VECTOR_PROVIDER",
              "RAG_SIMILARITY_THRESHOLD","RAG_TOP_K","PINECONE_API_KEY","PINECONE_INDEX","UPSTAGE_API_KEY",
              "LLM_API_KEY","LLM_API_BASE_URL","ALAN_CLIENT_ID"
          ]
          config = {key: os.environ.get(key, "") for key in keys}
          encoded = base64.b64encode(json.dumps(config, ensure_ascii=False, separators=(",", ":")).encode()).decode()
          print(f"::add-mask::{encoded}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"config={encoded}\n")
          PY

      - name: Deploy exact images to Windows mini PC
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            cd /d C:\home\dahum\app && git reset --hard HEAD && git clean -fd && git fetch --prune origin main && git checkout -B main origin/main && git reset --hard origin/main && git clean -fd && powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\home\dahum\app\deploy\scripts\deploy_resilient.ps1 -BackendImage "${{ steps.images.outputs.backend }}:${{ github.sha }}" -AiImage "${{ steps.images.outputs.ai }}:${{ github.sha }}" -RegistryUser "${{ github.actor }}" -RegistryToken "${{ secrets.GITHUB_TOKEN }}" -RuntimeConfigBase64 "${{ steps.runtime_config.outputs.config }}"

      - name: Verify public yellow.it.kr route
        shell: bash
        env:
          PUBLIC_URL: http://yellow.it.kr/
        run: |
          set -u
          rm -f /tmp/dahum-public.html
          for attempt in $(seq 1 36); do
            code="$(curl -L -sS -o /tmp/dahum-public.html -w '%{http_code}' --connect-timeout 5 --max-time 12 "$PUBLIC_URL" || true)"
            if [[ "$code" =~ ^2[0-9][0-9]$ ]] && grep -Fq '<title>닿음 | 가족 보안 도우미</title>' /tmp/dahum-public.html; then
              echo "Public Dahum route verified: $PUBLIC_URL (HTTP $code)"
              exit 0
            fi
            echo "Public route not ready yet: attempt=$attempt http=${code:-000}"
            sleep 5
          done
          echo "Public route verification failed: $PUBLIC_URL"
          if [[ -f /tmp/dahum-public.html ]]; then head -c 800 /tmp/dahum-public.html || true; echo; fi
          exit 1

      - name: Publish deployment result status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state='success'; description='Production deployment succeeded' ;;
            cancelled) state='error'; description='Production deployment was cancelled' ;;
            *) state='failure'; description='Build or production deployment failed' ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='deploy/yellow.it.kr' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
