name: Build images and deploy Dahum

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "ai/**"
      - "datas/data/malware_db.csv"
      - "datas/data/malware_embedding_data.csv"
      - "db/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
      - ".dockerignore"
  workflow_dispatch:

concurrency:
  group: dahum-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve GHCR image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${repo_lower}-backend" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/${repo_lower}-ai" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest
          cache-from: type=gha,scope=dahum-backend
          cache-to: type=gha,mode=max,scope=dahum-backend
      - name: Build and push Python AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.ai }}:${{ github.sha }}
            ${{ steps.images.outputs.ai }}:latest
          cache-from: type=gha,scope=dahum-ai
          cache-to: type=gha,mode=max,scope=dahum-ai
      - name: Build runtime configuration
        id: runtime_config
        shell: bash
        env:
          MARIADB_IMAGE: ${{ vars.MARIADB_IMAGE || 'mariadb:11.4' }}
          MARIADB_DATABASE: ${{ vars.MARIADB_DATABASE || 'dahum' }}
          MARIADB_USER: ${{ vars.MARIADB_USER || 'dahum_app' }}
          MARIADB_PASSWORD: ${{ secrets.SPRINGDATASOURCEPASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADBROOTPASSWORD }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE || 'prod' }}
          SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL || 'jdbc:mariadb://mariadb:3306/dahum' }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME || 'dahum_app' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRINGDATASOURCEPASSWORD }}
          SERVER_FORWARD_HEADERS_STRATEGY: ${{ vars.SERVER_FORWARD_HEADERS_STRATEGY || 'framework' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'http://ai:8000' }}
          DAHUM_RUNTIME: ${{ vars.DAHUM_RUNTIME || 'C:/home/dahum/runtime' }}
          DAHUM_HOST_PORT: ${{ vars.DAHUM_HOST_PORT || '9000' }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || 'yellow.it.kr' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://yellow.it.kr' }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAOCLIENTID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAOCLIENTSECRET }}
          CLOVA_OCR_URL: ${{ vars.CLOVAOCRURL || vars.CLOVA_OCR_URL || '' }}
          CLOVA_OCR_SECRET: ${{ secrets.CLOVAOCRSECRET || secrets.CLOVA_OCR_SECRET || '' }}
          VECTOR_PROVIDER: ${{ vars.VECTORPROVIDER || vars.VECTOR_PROVIDER || 'local' }}
          RAG_SIMILARITY_THRESHOLD: ${{ vars.RAGSIMILARITYTHRESHOLD || vars.RAG_SIMILARITY_THRESHOLD || '0.80' }}
          RAG_TOP_K: ${{ vars.RAGTOPK || vars.RAG_TOP_K || '5' }}
          PINECONE_API_KEY: ${{ secrets.PINECONEAPIKEY || secrets.PINECONE_API_KEY || '' }}
          PINECONE_INDEX: ${{ vars.PINECONEINDEX || vars.PINECONE_INDEX || 'dahum-malware' }}
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGEAPIKEY || secrets.UPSTAGE_API_KEY || '' }}
          LLM_API_KEY: ${{ secrets.LLMAPIKEY }}
          LLM_API_BASE_URL: ${{ vars.LLMAPIBASEURL || vars.LLM_API_BASE_URL || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          keys = ["MARIADB_IMAGE","MARIADB_DATABASE","MARIADB_USER","MARIADB_PASSWORD","MARIADB_ROOT_PASSWORD","SPRING_PROFILES_ACTIVE","SPRING_DATASOURCE_URL","SPRING_DATASOURCE_USERNAME","SPRING_DATASOURCE_PASSWORD","SERVER_FORWARD_HEADERS_STRATEGY","AI_BASE_URL","DAHUM_RUNTIME","DAHUM_HOST_PORT","PUBLIC_DOMAIN","PUBLIC_BASE_URL","KAKAO_CLIENT_ID","KAKAO_CLIENT_SECRET","CLOVA_OCR_URL","CLOVA_OCR_SECRET","VECTOR_PROVIDER","RAG_SIMILARITY_THRESHOLD","RAG_TOP_K","PINECONE_API_KEY","PINECONE_INDEX","UPSTAGE_API_KEY","LLM_API_KEY","LLM_API_BASE_URL"]
          config = {key: os.environ.get(key, "") for key in keys}
          encoded = base64.b64encode(json.dumps(config, ensure_ascii=False, separators=(",", ":")).encode()).decode()
          print(f"::add-mask::{encoded}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output: output.write(f"config={encoded}\n")
          PY
      - name: Deploy exact images to Windows mini PC
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            cd /d C:\home\dahum\app && git reset --hard HEAD && git clean -fd && git fetch --prune origin main && git checkout -B main origin/main && git reset --hard origin/main && git clean -fd && powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\home\dahum\app\deploy\scripts\deploy_python_first.ps1 -BackendImage "${{ steps.images.outputs.backend }}:${{ github.sha }}" -AiImage "${{ steps.images.outputs.ai }}:${{ github.sha }}" -RegistryUser "${{ github.actor }}" -RegistryToken "${{ secrets.GITHUB_TOKEN }}" -RuntimeConfigBase64 "${{ steps.runtime_config.outputs.config }}"
