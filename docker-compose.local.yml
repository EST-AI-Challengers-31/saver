name: dahum-local
services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-dahum}
      MARIADB_USER: ${MARIADB_USER:-dahum_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports: ["3307:3306"]
    volumes:
      - ./runtime/local-mariadb:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_DATABASE: ${MARIADB_DATABASE:-dahum}
      MARIADB_USER: ${MARIADB_USER:-dahum_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      VECTOR_PROVIDER: ${VECTOR_PROVIDER:-local}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.80}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX: ${PINECONE_INDEX:-dahum-malware}
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      MALWARE_DATA_DIR: /app/data
    ports: ["8000:8000"]
    volumes:
      - ./datas/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-dahum}
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-dahum_app}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD}
      AI_BASE_URL: http://ai:8000
      PUBLIC_BASE_URL: http://localhost:8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      CLOVA_OCR_URL: ${CLOVA_OCR_URL:-}
      CLOVA_OCR_SECRET: ${CLOVA_OCR_SECRET:-}
    ports: ["8080:8080"]
