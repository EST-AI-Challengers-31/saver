name: Diagnose Dahum ingress failure

on:
  workflow_run:
    workflows: ["Build images and deploy Dahum"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose-ingress:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIAGNOSTIC_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Publish ingress diagnostic pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${DIAGNOSTIC_HEAD_SHA}" \
            -f state='pending' \
            -f context='diagnose/yellow.it.kr' \
            -f description='Ingress diagnostics are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Probe public ingress from GitHub runner
        shell: bash
        env:
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || 'yellow.it.kr' }}
          HOST_PORT: ${{ vars.DAHUM_HOST_PORT || '9000' }}
        run: |
          set +e
          for url in \
            "http://${PUBLIC_DOMAIN}/" \
            "http://${PUBLIC_DOMAIN}:${HOST_PORT}/" \
            "https://${PUBLIC_DOMAIN}/"
          do
            body="$(mktemp)"
            code="$(curl -L -sS -o "$body" -w '%{http_code}' --connect-timeout 5 --max-time 12 "$url")"
            curl_exit=$?
            title="$(grep -o -m1 '<title>[^<]*</title>' "$body" 2>/dev/null || true)"
            echo "probe=$url curl_exit=$curl_exit http=${code:-000} ${title:-no-title}"
            rm -f "$body"
          done
          exit 0

      - name: Inspect mini PC ingress listeners
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 5m
          script: |
            cd /d C:\home\dahum\app && git fetch --prune origin main && git checkout -B main origin/main && git reset --hard origin/main && powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\home\dahum\app\deploy\scripts\diagnose_ingress.ps1 -HostPort "${{ vars.DAHUM_HOST_PORT || '9000' }}"

      - name: Publish ingress diagnostic result status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              state='success'
              description='Ingress diagnostics were collected'
              ;;
            cancelled)
              state='error'
              description='Ingress diagnostics were cancelled'
              ;;
            *)
              state='failure'
              description='Ingress diagnostics could not be completed'
              ;;
          esac

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${DIAGNOSTIC_HEAD_SHA}" \
            -f state="$state" \
            -f context='diagnose/yellow.it.kr' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
