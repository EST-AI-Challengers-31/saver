name: Deploy production services through saver SSH gateway

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-services.yml"
      - ".ops-trigger/service.txt"
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options: [aitm, restok, maple]
      force:
        description: Force redeploy even when source and operations revisions are unchanged
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "2,17,32,47 * * * *"
    - cron: "7,22,37,52 * * * *"
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: dahum-production
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate gateway boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'group: dahum-production' .github/workflows/deploy-services.yml
          grep -q 'packages: write' .github/workflows/deploy-services.yml
          grep -q '.ops-trigger/service.txt' .github/workflows/deploy-services.yml
          grep -q 'repository: chl4890620123-collab/Server' .github/workflows/deploy-services.yml
          grep -q 'SERVER_SSH_KEY' .github/workflows/deploy-services.yml
          grep -q 'saver-maple' .github/workflows/deploy-services.yml
          grep -q 'org.opencontainers.image.revision' .github/workflows/deploy-services.yml
          grep -q 'deploy-aitm.ps1' .github/workflows/deploy-services.yml
          grep -q 'deploy-restok.ps1' .github/workflows/deploy-services.yml
          grep -q 'run-maple-deploy.ps1' .github/workflows/deploy-services.yml

  deploy:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[deploy-service]') || contains(github.event.head_commit.message, 'fix(deploy)')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout saver gateway
        uses: actions/checkout@v5

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "2,17,32,47 * * * *") service=maple ;;
              "7,22,37,52 * * * *") service=aitm ;;
              "12,27,42,57 * * * *") service=restok ;;
              *) echo "Unknown deployment schedule" >&2; exit 1 ;;
            esac
            force=false
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [[ "${{ github.event.head_commit.message }}" == fix\(deploy\)* ]]; then
              service=maple
            else
              test -f .ops-trigger/service.txt || { echo "Push deployment trigger file is missing." >&2; exit 1; }
              service="$(tr -d '[:space:]' < .ops-trigger/service.txt)"
            fi
            force=true
          else
            service="${{ inputs.service }}"
            force="${{ inputs.force }}"
          fi

          case "$service" in
            aitm)
              repository="chl4890620123-collab/Aitm"
              local_url="http://127.0.0.1:9060"
              functional_path="/api/standards"
              ;;
            restok)
              repository="chl4890620123-collab/Restok-Rangchain"
              local_url="http://127.0.0.1:9050"
              functional_path="/api/auth/health"
              ;;
            maple)
              repository="chl4890620123-collab/maple"
              local_url="http://127.0.0.1:9040"
              functional_path="/api/meister/meta"
              ;;
            *) echo "Unsupported service: $service" >&2; exit 1 ;;
          esac

          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "local_url=$local_url" >> "$GITHUB_OUTPUT"
          echo "functional_path=$functional_path" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - name: Checkout Server operations repository
        uses: actions/checkout@v5
        with:
          repository: chl4890620123-collab/Server
          ref: main
          path: server-source

      - name: Checkout service source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: main
          path: service-source

      - name: Plan exact deployment
        id: plan
        shell: bash
        env:
          SERVICE: ${{ steps.target.outputs.service }}
          FORCE_REQUESTED: ${{ steps.target.outputs.force }}
        run: |
          set -euo pipefail
          source_sha="$(git -C service-source rev-parse HEAD)"
          server_sha="$(git -C server-source rev-parse HEAD)"
          status_file=".ops-status/${SERVICE}.txt"
          deployed_source_sha="$(sed -n 's/^source_sha=//p' "$status_file" 2>/dev/null | head -n1 || true)"
          deployed_server_sha="$(sed -n 's/^server_sha=//p' "$status_file" 2>/dev/null | head -n1 || true)"

          source_changed=false
          server_changed=false
          [ "$deployed_source_sha" = "$source_sha" ] || source_changed=true
          [ "$deployed_server_sha" = "$server_sha" ] || server_changed=true

          bundle=false
          registry=false
          case "$SERVICE" in
            aitm|maple)
              if [ "$FORCE_REQUESTED" = true ] || [ "$source_changed" = true ]; then registry=true; fi
              ;;
            restok)
              if [ "$FORCE_REQUESTED" = true ] || [ "$source_changed" = true ] || [ "$server_changed" = true ]; then bundle=true; fi
              ;;
          esac

          image_required=false
          if [ "$bundle" = true ] || [ "$registry" = true ]; then image_required=true; fi
          force_deploy=false
          if [ "$FORCE_REQUESTED" = true ] || [ "$server_changed" = true ]; then force_deploy=true; fi

          for pair in \
            "source_sha=$source_sha" "server_sha=$server_sha" \
            "deployed_source_sha=$deployed_source_sha" "deployed_server_sha=$deployed_server_sha" \
            "source_changed=$source_changed" "server_changed=$server_changed" \
            "bundle=$bundle" "registry=$registry" "image_required=$image_required" "force_deploy=$force_deploy"; do
            echo "$pair" >> "$GITHUB_OUTPUT"
          done

          echo "Service: $SERVICE"
          echo "Source SHA: $source_sha"
          echo "Server ops SHA: $server_sha"
          echo "Build SCP image bundle: $bundle"
          echo "Publish GHCR image: $registry"

      - name: Prepare exact deployment images
        id: build
        if: steps.plan.outputs.image_required == 'true'
        shell: bash
        env:
          SERVICE: ${{ steps.target.outputs.service }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          RESTOK_GOOGLE_OAUTH_ENABLED: ${{ vars.RESTOK_GOOGLE_OAUTH_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          registry_owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          case "$SERVICE" in
            aitm)
              registry_base="ghcr.io/${registry_owner}/saver-aitm"
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
              trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
              for spec in "ai:service-source/demo/ai" "backend:service-source/demo" "frontend:service-source/front"; do
                name="${spec%%:*}"
                path="${spec#*:}"
                ref="${registry_base}-${name}:${SOURCE_SHA}"
                docker build --pull --label "org.opencontainers.image.revision=${SOURCE_SHA}" -t "$ref" "$path"
                docker push "$ref"
              done
              ;;
            maple)
              image_ref="ghcr.io/${registry_owner}/saver-maple:${SOURCE_SHA}"
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
              trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
              docker build --pull \
                --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
                -t "$image_ref" service-source
              docker push "$image_ref"
              echo "Published Maple image: $image_ref"
              ;;
            restok)
              docker build --pull -t restok-production-ai:latest service-source/ai_server
              docker build --pull -t restok-production-backend:latest service-source/backend
              docker build --pull \
                --build-arg REACT_APP_API_URL= \
                --build-arg REACT_APP_GOOGLE_OAUTH_ENABLED="$RESTOK_GOOGLE_OAUTH_ENABLED" \
                -t restok-production-frontend:latest service-source/frontend
              docker pull mariadb:11.4
              docker pull caddy:2.10-alpine
              docker save \
                restok-production-ai:latest restok-production-backend:latest restok-production-frontend:latest \
                mariadb:11.4 caddy:2.10-alpine \
                | gzip -1 > "$RUNNER_TEMP/restok-images.tar.gz"
              test -s "$RUNNER_TEMP/restok-images.tar.gz"
              ls -lh "$RUNNER_TEMP/restok-images.tar.gz"
              ;;
          esac

      - name: Detect saver SSH configuration
        id: ssh
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          available=false
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && { [ -n "$SERVER_SSH_KEY" ] || [ -n "$SERVER_PASSWORD" ]; }; then available=true; fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Deploy through saver SSH gateway
        id: remote
        if: steps.ssh.outputs.available == 'true' && (steps.build.outcome == 'success' || steps.build.outcome == 'skipped')
        shell: bash
        env:
          SERVICE: ${{ steps.target.outputs.service }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          output_file="$RUNNER_TEMP/${SERVICE}-ssh-output.txt"
          port="${SERVER_PORT:-22}"
          key_args=()
          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/saver_deploy_key"
            chmod 600 "$HOME/.ssh/saver_deploy_key"
            key_args=(-i "$HOME/.ssh/saver_deploy_key")
          fi
          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
            transfer=(sshpass -e scp "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
            transfer=(scp "${key_args[@]}")
          fi
          ssh_options=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "powershell.exe -NoProfile -NonInteractive -Command \"New-Item -ItemType Directory -Force -Path 'C:\\home\\server' | Out-Null\""

          # Only Restok still uses an SCP image bundle. Maple is GHCR-only.
          if [ "${{ steps.plan.outputs.bundle }}" = true ]; then
            timeout 15m "${transfer[@]}" -P "$port" \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$RUNNER_TEMP/${SERVICE}-images.tar.gz" "$SERVER_USER@$SERVER_HOST:C:/home/server/${SERVICE}-images.tar.gz"
          fi

          cat > "$RUNNER_TEMP/service-remote.ps1" <<'PWSH'
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $service = '${{ steps.target.outputs.service }}'
          $expectedSourceSha = '${{ steps.plan.outputs.source_sha }}'
          $expectedServerSha = '${{ steps.plan.outputs.server_sha }}'
          $forceDeploy = '${{ steps.plan.outputs.force_deploy }}' -eq 'true'
          $bundleExpected = '${{ steps.plan.outputs.bundle }}' -eq 'true'
          $registryExpected = '${{ steps.plan.outputs.registry }}' -eq 'true'
          $ghcrUser = '${{ github.actor }}'
          $ghcrToken = '${{ github.token }}'
          $registryOwner = '${{ github.repository_owner }}'.ToLowerInvariant()

          $serverPath = 'C:\home\server\app'
          New-Item -ItemType Directory -Force -Path (Split-Path $serverPath -Parent) | Out-Null
          if (-not (Test-Path (Join-Path $serverPath '.git'))) {
              if (Test-Path $serverPath) { Remove-Item -Recurse -Force $serverPath }
              git clone 'https://github.com/chl4890620123-collab/Server.git' $serverPath
              if ($LASTEXITCODE -ne 0) { throw 'Server clone failed' }
          }

          Set-Location $serverPath
          git reset --hard HEAD
          git clean -fd
          git fetch --prune origin main
          if ($LASTEXITCODE -ne 0) { throw 'Server fetch failed' }
          git checkout -B main origin/main
          git reset --hard origin/main
          git clean -fd
          $actualServerSha = (git rev-parse HEAD | Out-String).Trim()
          if ($actualServerSha -ne $expectedServerSha) { throw "Server SHA changed: expected=$expectedServerSha actual=$actualServerSha" }

          switch ($service) {
              'aitm' { $sourceRepository = 'https://github.com/chl4890620123-collab/Aitm.git' }
              'restok' { $sourceRepository = 'https://github.com/chl4890620123-collab/Restok-Rangchain.git' }
              'maple' { $sourceRepository = 'https://github.com/chl4890620123-collab/maple.git' }
              default { throw "Unsupported service: $service" }
          }
          $remoteHeadLine = (git ls-remote $sourceRepository 'refs/heads/main' | Out-String).Trim()
          if (-not $remoteHeadLine) { throw "Could not resolve $service main SHA" }
          $remoteHead = ($remoteHeadLine -split '\s+')[0]
          if ($remoteHead -ne $expectedSourceSha) { throw "$service main changed during deployment" }

          $bundle = "C:\home\server\$service-images.tar.gz"
          if ($bundleExpected) {
              if (-not (Test-Path $bundle)) { throw "$service image bundle was not transferred." }
              Write-Host "[$service] loading SCP image bundle"
              docker load --input $bundle
              if ($LASTEXITCODE -ne 0) { throw "Failed to load $service image bundle." }
              Remove-Item -Force $bundle
          } elseif (Test-Path $bundle) {
              Remove-Item -Force $bundle
          }

          if ($registryExpected) {
              docker version *> $null
              if ($LASTEXITCODE -ne 0) { throw 'Docker Engine is not available.' }
              $dockerConfigRoot = Join-Path $env:TEMP ("$service-ghcr-" + [guid]::NewGuid().ToString('N'))
              $previousDockerConfig = $env:DOCKER_CONFIG
              try {
                  New-Item -ItemType Directory -Force -Path $dockerConfigRoot | Out-Null
                  '{"auths":{}}' | Set-Content -Path (Join-Path $dockerConfigRoot 'config.json') -Encoding ascii
                  $env:DOCKER_CONFIG = $dockerConfigRoot
                  $ghcrToken | docker login ghcr.io --username $ghcrUser --password-stdin
                  if ($LASTEXITCODE -ne 0) { throw 'GHCR login failed.' }

                  if ($service -eq 'aitm') {
                      $base = "ghcr.io/$registryOwner/saver-aitm"
                      $imageMap = [ordered]@{
                          "${base}-ai:${expectedSourceSha}" = 'aitm-production-ai:latest'
                          "${base}-backend:${expectedSourceSha}" = 'aitm-production-backend:latest'
                          "${base}-frontend:${expectedSourceSha}" = 'aitm-production-frontend:latest'
                      }
                      $runtimeImages = @('mariadb:10.11', 'caddy:2.10-alpine')
                  } elseif ($service -eq 'maple') {
                      $imageMap = [ordered]@{
                          "ghcr.io/$registryOwner/saver-maple:${expectedSourceSha}" = 'maple-production-app:latest'
                      }
                      $runtimeImages = @('mariadb:11.4', 'caddy:2.10-alpine')
                  } else {
                      throw "Registry staging is unsupported for $service"
                  }

                  foreach ($entry in $imageMap.GetEnumerator()) {
                      Write-Host "[$service] pulling $($entry.Key)"
                      docker pull $entry.Key
                      if ($LASTEXITCODE -ne 0) { throw "GHCR pull failed: $($entry.Key)" }
                      $revision = (docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' $entry.Key | Out-String).Trim()
                      if ($revision -ne $expectedSourceSha) { throw "Image revision mismatch: expected=$expectedSourceSha actual=$revision" }
                      docker tag $entry.Key $entry.Value
                      if ($LASTEXITCODE -ne 0) { throw "Image tag failed: $($entry.Value)" }
                  }

                  foreach ($runtimeImage in $runtimeImages) {
                      docker image inspect $runtimeImage *> $null
                      if ($LASTEXITCODE -ne 0) {
                          Write-Host "[$service] pulling runtime image $runtimeImage"
                          docker pull $runtimeImage
                          if ($LASTEXITCODE -ne 0) { throw "Runtime image pull failed: $runtimeImage" }
                      }
                  }
              } finally {
                  if ([string]::IsNullOrWhiteSpace($previousDockerConfig)) { Remove-Item Env:DOCKER_CONFIG -ErrorAction SilentlyContinue }
                  else { $env:DOCKER_CONFIG = $previousDockerConfig }
                  Remove-Item -Recurse -Force $dockerConfigRoot -ErrorAction SilentlyContinue
              }
          }

          Set-Location $serverPath
          switch ($service) {
              'aitm' {
                  & '.\deploy\scripts\deploy-aitm.ps1' -ExpectedSha $expectedSourceSha -Force:$forceDeploy
                  if (-not $?) { throw 'Aitm deploy script failed' }
              }
              'restok' {
                  & '.\deploy\scripts\check-restok-legacy-data.ps1'
                  if (-not $?) { throw 'Restok legacy data preflight failed' }
                  & '.\deploy\scripts\deploy-restok.ps1' -Force:$forceDeploy -Prebuilt
                  if (-not $?) { throw 'Restok deploy script failed' }
              }
              'maple' {
                  & '.\deploy\scripts\run-maple-deploy.ps1' -Force:$forceDeploy
                  if (-not $?) { throw 'Maple deploy script failed' }
              }
          }
          PWSH

          wrapper='$script = [Console]::In.ReadToEnd(); Invoke-Expression $script'
          encoded_wrapper="$(printf '%s' "$wrapper" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded_wrapper"
          set +e
          output="$(timeout 25m "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command" < "$RUNNER_TEMP/service-remote.ps1" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output" | tee "$output_file"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Record centralized deployment status
        id: record
        if: always()
        shell: bash
        env:
          SERVICE: ${{ steps.target.outputs.service }}
        run: |
          set -euo pipefail
          mkdir -p .ops-status
          output_file="$RUNNER_TEMP/${SERVICE}-ssh-output.txt"
          available='${{ steps.ssh.outputs.available }}'
          build_outcome='${{ steps.build.outcome }}'
          remote_outcome='${{ steps.remote.outcome }}'
          exit_code='${{ steps.remote.outputs.exit_code }}'
          [ -n "$exit_code" ] || exit_code=999

          final=failure
          connection=not_attempted
          public_url=''
          deployed_source_sha=''
          if [ "$available" != true ]; then
            final=skipped
          elif [ "$build_outcome" = failure ]; then
            final=failure
          elif [ "$remote_outcome" = success ]; then
            connection=attempted
            if [ "$exit_code" = 0 ] && [ -f "$output_file" ]; then
              public_url="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$output_file" | tail -n1 || true)"
              deployed_source_sha="$(grep -Eo "\[$SERVICE\] source SHA: [0-9a-f]{40}" "$output_file" | tail -n1 | awk '{print $4}' || true)"
              if [ -n "$public_url" ] && [ "$deployed_source_sha" = '${{ steps.plan.outputs.source_sha }}' ]; then
                echo "Verifying public URL from GitHub runner: $public_url"
                root_ok=false
                api_ok=false
                for attempt in 1 2 3 4 5 6; do
                  if curl --fail --silent --show-error --max-time 15 "$public_url/" >/tmp/public-root; then root_ok=true; fi
                  if curl --fail --silent --show-error --max-time 15 "$public_url${{ steps.target.outputs.functional_path }}" >/tmp/public-api; then api_ok=true; fi
                  if [ "$root_ok" = true ] && [ "$api_ok" = true ]; then break; fi
                  sleep 5
                done
                if [ "$root_ok" = true ] && [ "$api_ok" = true ]; then
                  final=success
                  cat > ".ops-status/${SERVICE}.txt" <<EOF
          source_sha=${{ steps.plan.outputs.source_sha }}
          server_sha=${{ steps.plan.outputs.server_sha }}
          public_url=$public_url
          public_health=$public_url${{ steps.target.outputs.functional_path }}
          local_url=${{ steps.target.outputs.local_url }}
          EOF
                fi
              fi
            fi
          elif [ "$remote_outcome" = failure ]; then
            connection=attempted
          fi

          if [ "$final" != success ]; then
            rm -f ".ops-status/${SERVICE}.txt"
          fi

          cat > ".ops-status/${SERVICE}-transport.txt" <<EOF
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          event=${{ github.event_name }}
          service=$SERVICE
          source_sha=${{ steps.plan.outputs.source_sha }}
          server_sha=${{ steps.plan.outputs.server_sha }}
          source_changed=${{ steps.plan.outputs.source_changed }}
          server_changed=${{ steps.plan.outputs.server_changed }}
          image_bundle=${{ steps.plan.outputs.bundle }}
          image_registry=${{ steps.plan.outputs.registry }}
          ssh_available=$available
          build=$build_outcome
          ssh_connection=$connection
          remote_exit_code=$exit_code
          deployment=$final
          EOF
          echo "final=$final" >> "$GITHUB_OUTPUT"

          tmpdir="$(mktemp -d)"
          cp ".ops-status/${SERVICE}-transport.txt" "$tmpdir/transport.txt"
          if [ -f ".ops-status/${SERVICE}.txt" ]; then cp ".ops-status/${SERVICE}.txt" "$tmpdir/status.txt"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p .ops-status
            cp "$tmpdir/transport.txt" ".ops-status/${SERVICE}-transport.txt"
            if [ -f "$tmpdir/status.txt" ]; then cp "$tmpdir/status.txt" ".ops-status/${SERVICE}.txt"
            else rm -f ".ops-status/${SERVICE}.txt"; fi
            git add -A ".ops-status/${SERVICE}.txt" ".ops-status/${SERVICE}-transport.txt"
            if git diff --cached --quiet; then published=true; break; fi
            git commit -m "chore: record ${SERVICE} deployment result"
            if git push origin HEAD:main; then published=true; break; fi
            sleep $((attempt * 2))
          done
          rm -rf "$tmpdir"
          [ "$published" = true ] || { echo "Failed to publish $SERVICE deployment status." >&2; exit 1; }

      - name: Enforce deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.record.outputs.final }}' != success ]; then
            echo '${{ steps.target.outputs.service }} deployment or verification failed.' >&2
            exit 1
          fi
