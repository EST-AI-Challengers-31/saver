services:
  mariadb:
    image: ${MARIADB_IMAGE}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADBDATABASE}
      MARIADB_USER: ${MARIADBUSER}
      MARIADB_PASSWORD: ${MARIADBPASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADBROOTPASSWORD}
    volumes:
      - ${DAHUM_RUNTIME}/data/mariadb:/var/lib/mysql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - dahum_internal

  ai:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    restart: unless-stopped
    environment:
      CLOVA_OCR_API_KEY: ${CLOVAOCRAPIKEY}
      LLM_API_KEY: ${LLMAPIKEY}
      PINECONE_API_KEY: ${PINECONEAPIKEY}
      PINECONE_INDEX: ${PINECONEINDEX}
      RAG_SIMILARITY_THRESHOLD: ${RAGSIMILARITYTHRESHOLD}
      RAG_TOP_K: ${RAGTOPK}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    networks:
      - dahum_internal

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRINGPROFILESACTIVE}
      SPRING_DATASOURCE_URL: ${SPRINGDATASOURCEURL}
      SPRING_DATASOURCE_USERNAME: ${SPRINGDATASOURCEUSERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRINGDATASOURCEPASSWORD}
      AI_BASE_URL: ${AIBASEURL}
      PUBLIC_BASE_URL: ${PUBLICBASEURL}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVERFORWARDHEADERSSTRATEGY}
      KAKAO_CLIENT_ID: ${KAKAOCLIENTID}
      KAKAO_CLIENT_SECRET: ${KAKAOCLIENTSECRET}
      GOOGLE_CLIENT_ID: ${GOOGLECLIENTID}
      GOOGLE_CLIENT_SECRET: ${GOOGLECLIENTSECRET}
    expose:
      - "8080"
    networks:
      - dahum_internal
      - dahum_web

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${DAHUM_HOST_PORT}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - dahum_web

networks:
  dahum_internal:
  dahum_web:
