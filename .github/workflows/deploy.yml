name: Build images and deploy Dahum

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "ai/**"
      - "db/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: dahum-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve GHCR image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${repo_lower}-backend" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/${repo_lower}-ai" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image (React + Spring Boot)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest
          cache-from: type=gha,scope=dahum-backend
          cache-to: type=gha,mode=max,scope=dahum-backend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.ai }}:${{ github.sha }}
            ${{ steps.images.outputs.ai }}:latest
          cache-from: type=gha,scope=dahum-ai
          cache-to: type=gha,mode=max,scope=dahum-ai
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deploy exact images to Windows mini PC
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          AI_IMAGE: ${{ steps.images.outputs.ai }}:${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          SERVER_APP_PATH: ${{ vars.SERVER_APP_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN,BACKEND_IMAGE,AI_IMAGE,DEPLOY_SHA,EXPECTED_REPOSITORY,SERVER_APP_PATH
          script: |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $appPath=$env:SERVER_APP_PATH; if ([string]::IsNullOrWhiteSpace($appPath)) { $appPath='C:\home\dahum\app' }; if (-not (Test-Path -LiteralPath $appPath)) { throw ('Dahum repository path not found: ' + $appPath) }; Set-Location -LiteralPath $appPath; $origin=(git remote get-url origin).Trim(); if ($LASTEXITCODE -ne 0) { throw 'git remote get-url origin failed' }; if ($origin -notmatch [regex]::Escape($env:EXPECTED_REPOSITORY)) { throw ('Wrong repository at server path. Expected ' + $env:EXPECTED_REPOSITORY + ', found ' + $origin) }; $dirty=@(git status --porcelain); if ($LASTEXITCODE -ne 0) { throw 'git status failed' }; if ($dirty.Count -gt 0) { throw 'Server repository has uncommitted changes' }; $previous=(git rev-parse HEAD).Trim(); git fetch --prune origin main; if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }; git checkout main; if ($LASTEXITCODE -ne 0) { throw 'git checkout failed' }; git pull --ff-only origin main; if ($LASTEXITCODE -ne 0) { throw 'git pull failed' }; & '.\deploy\scripts\deploy.ps1' -SkipGitUpdate -BackendImage $env:BACKEND_IMAGE -AiImage $env:AI_IMAGE -RegistryUser $env:GHCR_USER -RegistryToken $env:GHCR_TOKEN -RollbackCommit $previous; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"
