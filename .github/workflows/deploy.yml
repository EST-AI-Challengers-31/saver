name: Build images and deploy Dahum

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "ai/**"
      - "db/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: dahum-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve GHCR image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          repo_lower="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          echo "backend=ghcr.io/${repo_lower}-backend" >> "$GITHUB_OUTPUT"
          echo "ai=ghcr.io/${repo_lower}-ai" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image (React + Spring Boot)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest
          cache-from: type=gha,scope=dahum-backend
          cache-to: type=gha,mode=max,scope=dahum-backend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.ai }}:${{ github.sha }}
            ${{ steps.images.outputs.ai }}:latest
          cache-from: type=gha,scope=dahum-ai
          cache-to: type=gha,mode=max,scope=dahum-ai
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deploy exact images to Windows mini PC
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}

          # SSH key authentication
          key: ${{ secrets.SERVER_SSH_KEY }}

          # Keep password fallback during initial deployment testing.
          # After key authentication is fully verified in Actions,
          # this line can be removed.
          password: ${{ secrets.SERVER_PASSWORD }}

          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m

          script: |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& {
              $ErrorActionPreference = 'Stop'

              # --------------------------------------------------------
              # 1. Resolve server application path
              # --------------------------------------------------------

              $appPath = '${{ vars.SERVER_APP_PATH }}'

              if ([string]::IsNullOrWhiteSpace($appPath)) {
                $appPath = 'C:\home\dahum\app'
              }

              Write-Host ('Dahum application path: ' + $appPath)

              if (-not (Test-Path -LiteralPath $appPath)) {
                throw ('Dahum repository path not found: ' + $appPath)
              }

              Set-Location -LiteralPath $appPath


              # --------------------------------------------------------
              # 2. Verify that this is the correct Git repository
              # --------------------------------------------------------

              $expectedRepository = '${{ github.repository }}'

              $origin = (git remote get-url origin).Trim()

              if ($LASTEXITCODE -ne 0) {
                throw 'git remote get-url origin failed'
              }

              Write-Host ('Git origin: ' + $origin)

              if ($origin -notmatch [regex]::Escape($expectedRepository)) {
                throw (
                  'Wrong repository at server path. Expected ' +
                  $expectedRepository +
                  ', found ' +
                  $origin
                )
              }


              # --------------------------------------------------------
              # 3. Refuse deployment when server source has local edits
              # --------------------------------------------------------

              $dirty = @(git status --porcelain)

              if ($LASTEXITCODE -ne 0) {
                throw 'git status failed'
              }

              if ($dirty.Count -gt 0) {
                Write-Host 'Server repository has uncommitted changes:'
                $dirty | ForEach-Object {
                  Write-Host $_
                }

                throw 'Server repository has uncommitted changes'
              }


              # --------------------------------------------------------
              # 4. Remember previous commit for image rollback
              # --------------------------------------------------------

              $previous = (git rev-parse HEAD).Trim()

              if ($LASTEXITCODE -ne 0) {
                throw 'git rev-parse HEAD failed'
              }

              Write-Host ('Previous server commit: ' + $previous)


              # --------------------------------------------------------
              # 5. Update source repository
              # --------------------------------------------------------

              Write-Host 'Fetching latest main branch...'

              git fetch --prune origin main

              if ($LASTEXITCODE -ne 0) {
                throw 'git fetch failed'
              }

              git checkout main

              if ($LASTEXITCODE -ne 0) {
                throw 'git checkout failed'
              }

              git pull --ff-only origin main

              if ($LASTEXITCODE -ne 0) {
                throw 'git pull failed'
              }

              $current = (git rev-parse HEAD).Trim()

              Write-Host ('Current server commit: ' + $current)


              # --------------------------------------------------------
              # 6. Resolve immutable Docker image names
              # --------------------------------------------------------

              $backendImage = '${{ steps.images.outputs.backend }}:${{ github.sha }}'
              $aiImage = '${{ steps.images.outputs.ai }}:${{ github.sha }}'

              Write-Host ('Backend image: ' + $backendImage)
              Write-Host ('AI image: ' + $aiImage)


              # --------------------------------------------------------
              # 7. Run the Windows deployment script
              # --------------------------------------------------------

              $deployScript = Join-Path $appPath 'deploy\scripts\deploy.ps1'

              if (-not (Test-Path -LiteralPath $deployScript)) {
                throw ('Deployment script not found: ' + $deployScript)
              }

              Write-Host 'Starting Dahum deployment...'

              & $deployScript `
                -SkipGitUpdate `
                -BackendImage $backendImage `
                -AiImage $aiImage `
                -RegistryUser '${{ github.actor }}' `
                -RegistryToken '${{ secrets.GITHUB_TOKEN }}' `
                -RollbackCommit $previous

              if ($LASTEXITCODE -ne 0) {
                throw ('deploy.ps1 failed with exit code ' + $LASTEXITCODE)
              }


              # --------------------------------------------------------
              # 8. Deployment completed
              # --------------------------------------------------------

              Write-Host 'Dahum deployment completed successfully.'
            }"
