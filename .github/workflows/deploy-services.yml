name: Deploy production services through saver SSH gateway

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-services.yml"
      - ".ops-trigger/service.txt"
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        type: choice
        options: [aitm, restok, maple]
      force:
        description: Force redeploy
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "2,17,32,47 * * * *"
    - cron: "7,22,37,52 * * * *"
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: write

concurrency:
  group: dahum-production-${{ inputs.service || (github.event.schedule == '2,17,32,47 * * * *' && 'maple') || (github.event.schedule == '7,22,37,52 * * * *' && 'aitm') || (github.event.schedule == '12,27,42,57 * * * *' && 'restok') || 'maple' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout saver gateway
        uses: actions/checkout@v5

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "2,17,32,47 * * * *") service=maple ;;
              "7,22,37,52 * * * *") service=aitm ;;
              "12,27,42,57 * * * *") service=restok ;;
              *) echo "Unknown deployment schedule" >&2; exit 1 ;;
            esac
            force=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            service="${{ inputs.service }}"
            force="${{ inputs.force }}"
          else
            test -f .ops-trigger/service.txt || { echo "Push deployment trigger file is missing." >&2; exit 1; }
            service="$(tr -d '[:space:]' < .ops-trigger/service.txt)"
            force=true
          fi

          case "$service" in
            maple)
              local_url="http://127.0.0.1:9040"
              functional_path="/api/meister/meta"
              ;;
            aitm)
              local_url="http://127.0.0.1:9060"
              functional_path="/api/standards"
              ;;
            restok)
              local_url="http://127.0.0.1:9050"
              functional_path="/api/auth/health"
              ;;
            *) echo "Unsupported service: $service" >&2; exit 1 ;;
          esac

          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "local_url=$local_url" >> "$GITHUB_OUTPUT"
          echo "functional_path=$functional_path" >> "$GITHUB_OUTPUT"

      - name: Detect saver SSH configuration
        id: ssh
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          available=false
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_USER" ] && { [ -n "$SERVER_SSH_KEY" ] || [ -n "$SERVER_PASSWORD" ]; }; then
            available=true
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Deploy through Server entrypoint
        id: remote
        if: steps.ssh.outputs.available == 'true'
        shell: bash
        env:
          SERVICE: ${{ steps.target.outputs.service }}
          FORCE: ${{ steps.target.outputs.force }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          port="${SERVER_PORT:-22}"
          key_args=()
          if [ -n "$SERVER_SSH_KEY" ]; then
            printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/saver_deploy_key"
            chmod 600 "$HOME/.ssh/saver_deploy_key"
            key_args=(-i "$HOME/.ssh/saver_deploy_key")
          fi
          if [ -n "$SERVER_PASSWORD" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$SERVER_PASSWORD"
            auth=(sshpass -e ssh "${key_args[@]}")
          else
            auth=(ssh "${key_args[@]}")
          fi
          ssh_options=(-o BatchMode=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          if [ "$FORCE" = true ]; then
            force_arg=' -Force'
          else
            force_arg=''
          fi

          remote_script="$RUNNER_TEMP/deploy-service.ps1"
          cat > "$remote_script" <<PWSH
          \$ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          \$serverPath = 'C:\home\server\app'
          New-Item -ItemType Directory -Force -Path (Split-Path \$serverPath -Parent) | Out-Null
          if (-not (Test-Path (Join-Path \$serverPath '.git'))) {
              if (Test-Path \$serverPath) { Remove-Item -Recurse -Force \$serverPath }
              git clone 'https://github.com/chl4890620123-collab/Server.git' \$serverPath
              if (\$LASTEXITCODE -ne 0) { throw 'Server clone failed' }
          }
          git -C \$serverPath reset --hard HEAD
          git -C \$serverPath clean -fd
          git -C \$serverPath fetch --prune origin main
          if (\$LASTEXITCODE -ne 0) { throw 'Server fetch failed' }
          git -C \$serverPath checkout -B main origin/main
          git -C \$serverPath reset --hard origin/main
          git -C \$serverPath clean -fd
          Set-Location \$serverPath
          & '.\deploy\scripts\deploy-service.ps1' -Service '$SERVICE'$force_arg
          if (-not \$?) { throw '$SERVICE deployment failed' }
          PWSH

          wrapper='$script = [Console]::In.ReadToEnd(); Invoke-Expression $script'
          encoded_wrapper="$(printf '%s' "$wrapper" | iconv -f UTF-8 -t UTF-16LE | base64 -w0)"
          remote_command="powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded_wrapper"

          set +e
          output="$(timeout 35m "${auth[@]}" -p "$port" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" "$remote_command" < "$remote_script" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/${SERVICE}-ssh-output.txt"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record centralized deployment status
        id: record
        if: always()
        shell: bash
        env:
          SERVICE: ${{ steps.target.outputs.service }}
        run: |
          set -euo pipefail
          mkdir -p .ops-status
          output_file="$RUNNER_TEMP/${SERVICE}-ssh-output.txt"
          exit_code='${{ steps.remote.outputs.exit_code }}'
          [ -n "$exit_code" ] || exit_code=999
          final=failure
          public_url=''
          source_sha=''

          if [ '${{ steps.ssh.outputs.available }}' != true ]; then
            final=skipped
          elif [ "$exit_code" = 0 ] && [ -f "$output_file" ]; then
            public_url="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$output_file" | tail -n1 || true)"
            source_sha="$(grep -Eo "\[$SERVICE\] source SHA: [0-9a-f]{40}" "$output_file" | tail -n1 | awk '{print $4}' || true)"
            if [ -n "$public_url" ] && [ -n "$source_sha" ]; then
              root_ok=false
              api_ok=false
              for attempt in 1 2 3 4 5 6; do
                if curl --fail --silent --show-error --max-time 15 "$public_url/" >/dev/null; then root_ok=true; fi
                if curl --fail --silent --show-error --max-time 15 "$public_url${{ steps.target.outputs.functional_path }}" >/dev/null; then api_ok=true; fi
                if [ "$root_ok" = true ] && [ "$api_ok" = true ]; then break; fi
                sleep 5
              done
              if [ "$root_ok" = true ] && [ "$api_ok" = true ]; then
                final=success
                cat > ".ops-status/${SERVICE}.txt" <<EOF
          source_sha=$source_sha
          public_url=$public_url
          public_health=$public_url${{ steps.target.outputs.functional_path }}
          local_url=${{ steps.target.outputs.local_url }}
          EOF
              fi
            fi
          fi

          if [ "$final" != success ]; then
            rm -f ".ops-status/${SERVICE}.txt"
          fi

          cat > ".ops-status/${SERVICE}-transport.txt" <<EOF
          run_id=${{ github.run_id }}
          service=$SERVICE
          ssh_available=${{ steps.ssh.outputs.available }}
          remote_exit_code=$exit_code
          deployment=$final
          EOF
          echo "final=$final" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .ops-status
          if ! git diff --cached --quiet; then
            git commit -m "chore: record ${SERVICE} deployment result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.record.outputs.final }}' != success ]; then
            echo '${{ steps.target.outputs.service }} deployment or verification failed.' >&2
            exit 1
          fi
